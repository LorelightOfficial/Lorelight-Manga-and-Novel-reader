name: Build and publish release

# This workflow runs in this PUBLIC repository so it uses GitHub's unlimited
# free Actions minutes for public repos. The application source lives in the
# private LorelightOfficial/Lorelight repository and is fetched fresh into
# this job's ephemeral runner for each build - it is never committed to this
# repo. Only the finished, signed APKs are published, as a Release here.
#
# Triggered either by a repository_dispatch sent from the private source repo
# after it unpacks a new zip, or manually from the Actions tab.
on:
  repository_dispatch:
    types: [build-lorelight]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
    steps:
      - name: Check required secrets
        run: |
          test -n "${{ secrets.PAT_TOKEN }}" || { echo "::error::Missing secret PAT_TOKEN (a PAT with 'repo' scope, so this job can read the private Lorelight repo)"; exit 1; }
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing secret KEYSTORE_BASE64"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing secret KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing secret KEY_PASSWORD"; exit 1; }

      - name: Checkout private source repository
        uses: actions/checkout@v4
        with:
          repository: LorelightOfficial/Lorelight
          token: ${{ secrets.PAT_TOKEN }}
          path: source
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Generate Gradle wrapper
        working-directory: source
        run: |
          gradle wrapper --gradle-version 8.13
          chmod +x gradlew

      - name: Decode release keystore and write .env
        working-directory: source
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat > .env <<EOF_ENV
          FONTS_API_KEY=
          RELEASE_KEYSTORE_PATH=release.keystore
          RELEASE_KEY_ALIAS=$KEY_ALIAS
          RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          RELEASE_STORE_PASSWORD=${STORE_PASSWORD:-$KEY_PASSWORD}
          EOF_ENV

      - name: Build release APK
        working-directory: source
        env:
          # Several mihon dependencies come from jitpack.io, which builds
          # artifacts on demand and is frequently slow to respond. Gradle's
          # default 30s socket timeout with a single attempt caused
          # "SocketTimeoutException: Read timed out" failures, so give it far
          # more patience and let Gradle itself retry each request.
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=180000
            -Dorg.gradle.internal.http.socketTimeout=180000
            -Dorg.gradle.internal.repository.max.retries=6
            -Dorg.gradle.internal.repository.initial.backoff=1000
        run: |
          # Dependencies that downloaded successfully stay in the Gradle cache,
          # so each retry picks up where the last one stopped rather than
          # starting from scratch.
          for attempt in 1 2 3; do
            echo "::group::Build attempt $attempt of 3"
            if ./gradlew assembleRelease --no-configuration-cache --stacktrace; then
              echo "::endgroup::"
              echo "Build succeeded on attempt $attempt."
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Attempt $attempt failed. This is usually a jitpack.io timeout while fetching dependencies. Retrying in 30s..."
              sleep 30
            fi
          done
          echo "::error::Build failed after 3 attempts. Scroll up to the last attempt for the real cause."
          exit 1

      - name: Collect built APKs
        id: collect
        run: |
          set -e
          VERSION=$(grep -m1 'versionName' source/app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
          mkdir -p out
          for f in source/app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f")
            abi=$(echo "$base" | sed -E 's/^app-(.+)-release(-unsigned)?\.apk$/\1/')
            if [ "$abi" = "$base" ]; then abi="universal"; fi
            cp "$f" "out/Lorelight-${VERSION}-${abi}.apk"
          done
          ls -l out
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Uploaded before publishing so a failure in the release step never
      # throws away a 12 minute build - the APKs stay downloadable from the
      # run's Artifacts section either way.
      - name: Upload APKs as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lorelight-${{ steps.collect.outputs.version }}-apks
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APKs to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          # Only the private source is checked out here, into source/, so the
          # workspace root is not a git repository. Without this, gh tries to
          # infer the target repo from git and fails with
          # "fatal: not a git repository".
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.collect.outputs.version }}
        run: |
          set -e
          TAG="v${VERSION}-${GITHUB_RUN_NUMBER}"
          printf 'Automated build.\n\nVersion: %s\nRun: %s\n' "$VERSION" "$GITHUB_RUN_NUMBER" > /tmp/notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists - uploading assets"
            gh release upload "$TAG" out/*.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "Creating release $TAG"
            gh release create "$TAG" out/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "Lorelight $VERSION (build $GITHUB_RUN_NUMBER)" \
              --notes-file /tmp/notes.md \
              --latest
          fi

      - name: Clean up fetched source
        if: always()
        run: rm -rf source
