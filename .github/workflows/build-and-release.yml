name: Build and publish release

# This workflow runs in this PUBLIC repository so it uses GitHub's unlimited
# free Actions minutes for public repos. The application source lives in the
# private LorelightOfficial/LorelightOfficial repository and is fetched fresh
# into this job's ephemeral runner for each build - it is never committed to
# this repo. Only the finished, signed APKs are published, as a Release here.
#
# Triggered either by a repository_dispatch sent from the private source repo
# after it unpacks a new zip, or manually from the Actions tab.
on:
  repository_dispatch:
    types: [build-lorelight]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
    steps:
      - name: Check required secrets
        run: |
          test -n "${{ secrets.PAT_TOKEN }}" || { echo "::error::Missing secret PAT_TOKEN (a PAT with 'repo' scope, so this job can read the private source repo)"; exit 1; }
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing secret KEYSTORE_BASE64"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing secret KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing secret KEY_PASSWORD"; exit 1; }

      - name: Checkout private source repository
        uses: actions/checkout@v4
        with:
          repository: LorelightOfficial/LorelightOfficial
          token: ${{ secrets.PAT_TOKEN }}
          path: source
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.13

      - name: Generate Gradle wrapper
        working-directory: source
        run: |
          gradle wrapper --gradle-version 8.13
          chmod +x gradlew

      - name: Decode release keystore and write .env
        working-directory: source
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat > .env <<EOF_ENV
          FONTS_API_KEY=
          RELEASE_KEYSTORE_PATH=release.keystore
          RELEASE_KEY_ALIAS=$KEY_ALIAS
          RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          RELEASE_STORE_PASSWORD=${STORE_PASSWORD:-$KEY_PASSWORD}
          EOF_ENV

      - name: Build release APK
        working-directory: source
        run: ./gradlew assembleRelease --no-configuration-cache --stacktrace

      - name: Publish APKs to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(grep -m1 'versionName' source/app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
          TAG="v${VERSION}-${GITHUB_RUN_NUMBER}"
          mkdir -p out
          for f in source/app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f")
            abi=$(echo "$base" | sed -E 's/^app-(.+)-release(-unsigned)?\.apk$/\1/')
            if [ "$abi" = "$base" ]; then abi="universal"; fi
            cp "$f" "out/Lorelight-${VERSION}-${abi}.apk"
          done
          ls -l out
          printf 'Automated build.\n\nVersion: %s\nRun: %s\n' "$VERSION" "$GITHUB_RUN_NUMBER" > /tmp/notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists - uploading assets"
            gh release upload "$TAG" out/*.apk --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" out/*.apk --title "Lorelight $VERSION (build $GITHUB_RUN_NUMBER)" --notes-file /tmp/notes.md --latest
          fi

      - name: Clean up fetched source
        if: always()
        run: rm -rf source
